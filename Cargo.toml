[workspace]
resolver = "2"
members = ["crates/reel-core", "crates/reel-http", "crates/reel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
reel-core = { path = "crates/reel-core" }
reel-http = { path = "crates/reel-http" }

anyhow = "1"
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["time"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

librqbit = "9.0.1"

clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
