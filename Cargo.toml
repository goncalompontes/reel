[workspace]
resolver = "2"
members = [
    "crates/reel-core",
    "crates/reel-http",
    "crates/reel-player",
    "crates/reel-catalog",
    "crates/reel-cast",
    "crates/reel-cast-gcast",
    "crates/reel-media",
    "crates/reel-cli",
    "crates/reel-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# The real floor for building the workspace: the desktop app pulls eframe/egui
# 0.36, which declare `rust-version = 1.95` (wgpu needs 1.87). Declaring 1.86
# was wrong — cargo refuses to build those packages on anything older. The
# headless crates (reel-core/-http/-cli) build on less, but the workspace is one
# number.
rust-version = "1.95"

[workspace.dependencies]
reel-core = { path = "crates/reel-core" }
reel-player = { path = "crates/reel-player" }
reel-desktop = { path = "crates/reel-desktop" }
reel-http = { path = "crates/reel-http" }
reel-catalog = { path = "crates/reel-catalog" }
reel-cast = { path = "crates/reel-cast" }
reel-cast-gcast = { path = "crates/reel-cast-gcast" }
reel-media = { path = "crates/reel-media" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quick-xml = "0.41"

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["time"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

librqbit = "9.0.1"
libloading = "0.8"
egui_extras = { version = "0.36", features = ["image", "file"] }

clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "blocking", "query"] }
scraper = "0.24"
# SHA-256 for the ext.to magnet token (`hmac` field): the site signs
# `torrent_id|timestamp|page_token` and the backend must reproduce it.
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

# A small patch to librqbit: reel must be able to fetch only the window around
# the playhead while streaming, instead of the whole selected file. Selection is
# file-granular upstream, so the piece picker is patched to skip the ordered
# queue when a torrent is stream-only. See vendor/librqbit.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
# The Google Cast Default Media Receiver rejects `streamType: NONE` (which the
# sender SDK hardcodes) with `LOAD_FAILED`; a file load must be `BUFFERED`. See
# vendor/fcast-sender-sdk. Port this patch on any SDK bump.
fcast-sender-sdk = { path = "vendor/fcast-sender-sdk" }
# Side-loaded subtitle tracks (`tracks` / `activeTrackIds`), which the sender SDK
# could not attach. See vendor/fcast-sender-sdk/REEL_PATCHES.md.
google-cast-protocol = { path = "vendor/google-cast-protocol" }
