[package]
name = "reel-cast"
description = "DLNA/UPnP-AV casting: SSDP discovery and AVTransport control for reel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
quick-xml.workspace = true
url.workspace = true
async-trait.workspace = true
reqwest.workspace = true

# Discovery only: rupnp does SSDP (per-interface, with group joins) and mdns-sd
# does mDNS. The AVTransport/SOAP control stays ours.
rupnp = "3"
mdns-sd = "0.21"
futures-util = "0.3"

tokio = { workspace = true }

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
