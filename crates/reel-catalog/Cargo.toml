[package]
name = "reel-catalog"
description = "Metadata, artwork and watch history for reel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reel-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
# HTML scraping: search backends that are index sites rather than APIs (ext.to)
# parse result tables with a real HTML5 parser rather than brittle string
# surgery. html5ever-based, so it tolerates the markup these sites emit.
scraper.workspace = true
sha2.workspace = true
# Release-name parsing: hunch is a pure-Rust guessit descendant that handles
# films, TV and anime. Chosen over hand-rolling after comparing its output on
# the cases this app depends on (see docs/ARCHITECTURE.md).
hunch = { version = "2", default-features = false }

[dev-dependencies]
axum.workspace = true
tracing-subscriber.workspace = true
