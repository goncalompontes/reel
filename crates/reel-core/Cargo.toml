[package]
name = "reel-core"
description = "Torrent engine and streaming primitives for reel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
# `disable-upload` is a hard guarantee: reel must never seed what it holds,
# however briefly, so the capability is compiled out and the session flag set.
librqbit = { workspace = true, features = ["disable-upload"] }
